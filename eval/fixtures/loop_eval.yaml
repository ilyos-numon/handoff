# LLM 지식 루프 평가 데이터 (python -m handoff.evaluation_loop).
# 가상의 결제 서비스 백엔드 담당자 기준. 사람은 역할로만 적는다.
# depth_cases: gold 는 사람이 정한 5슬롯 상태, supplement 는 gold 의 첫 빈 슬롯을 채우는 보충 답.
depth_cases:
  - question: "매일 새벽 정산 배치가 끝나면 무엇을 하나요?"
    answer: "매일 아침 정산 배치 결과 화면에서 처리 건수와 실패 건수를 확인합니다."
    gold: {why: missing, when: filled, who: missing, how: filled, fallback: missing}
    supplement: "실패 건이 있으면 그날 정산 파일이 대행사로 나가지 않기 때문입니다."
  - question: "결제 대행사 연동 키는 어떻게 갱신하나요?"
    answer: "매년 만료 30일 전에 먼저 대행사 관리 화면에서 새 키를 발급받아 교체합니다. 인증서가 만료되면 결제가 모두 실패하기 때문입니다."
    gold: {why: filled, when: filled, who: missing, how: filled, fallback: missing}
    supplement: "교체 작업은 결제팀 리드에게 미리 알리고 진행합니다."
  - question: "새벽 승인 지연 알림이 오면 어떻게 하나요?"
    answer: "알림 시각이 정산 배치 시간대와 겹치는 경우 승인 실패율을 먼저 확인하고, 평소와 같으면 오탐으로 보고 넘어갑니다."
    gold: {why: missing, when: filled, who: missing, how: filled, fallback: missing}
    supplement: "정산 배치가 데이터베이스를 많이 써서 잠깐 느려지는 것이기 때문입니다."
  - question: "정산 배치가 실패하면 어떻게 복구하나요?"
    answer: "로그에서 실패한 단계를 확인하고 원인을 고친 뒤 재실행 스크립트로 그 날짜만 다시 돌립니다."
    gold: {why: missing, when: missing, who: missing, how: filled, fallback: missing}
    supplement: "다른 날짜까지 다시 돌리면 정산이 중복되기 때문입니다."
  - question: "일하다 막히면 누구에게 물어보나요?"
    answer: "결제팀 리드에게 결제 개발 채널로 먼저 묻습니다. 급하면 메신저 음성 통화를 씁니다."
    gold: {why: missing, when: missing, who: filled, how: filled, fallback: filled}
    supplement: "리드가 결제 구조 변경을 승인하는 역할이기 때문입니다."
  - question: "결제 원장 테이블을 조회할 때 주의할 점이 있나요?"
    answer: "건수가 많아서 조건 없이 조회하면 운영 데이터베이스가 느려지기 때문에 반드시 거래 일자 조건을 넣어 조회합니다."
    gold: {why: filled, when: missing, who: missing, how: filled, fallback: missing}
    supplement: "운영 원장을 직접 봐야 하는 경우에는 항상 그렇게 합니다."
  - question: "인프라 권한은 어떻게 신청하나요?"
    answer: "인프라팀 요청 게시판에 사유와 기간을 적는 절차로 신청합니다. 권한 기록을 남겨야 하기 때문입니다."
    gold: {why: filled, when: missing, who: filled, how: filled, fallback: missing}
    supplement: "새 시스템을 맡게 되어 권한이 필요할 때 신청합니다."
  - question: "배포 후에는 무엇을 확인하나요?"
    answer: "배포 직후 30분 동안 승인 실패율과 에러 로그를 확인합니다. 정산 배치가 주말 내내 실패한 적이 있기 때문에 금요일에는 배포하지 않습니다."
    gold: {why: filled, when: filled, who: missing, how: filled, fallback: missing}
    supplement: "배포는 결제팀 리드 확인을 받은 뒤 진행합니다."
  - question: "매주 월요일 미정산 목록은 어떻게 넘기나요?"
    answer: "매주 월요일 오전에 관리자 화면에서 미정산 목록을 조회해 정산 담당에게 보냅니다. 지급 보류 건을 늦게 알면 지급이 밀리기 때문입니다."
    gold: {why: filled, when: filled, who: filled, how: filled, fallback: missing}
    supplement: "관리자 화면이 안 되면 정산 쿼리로 직접 뽑아 보냅니다."
  - question: "결제 대행사 장애가 나면 누구에게 알리나요?"
    answer: "대행사 응답 오류가 5분 넘게 이어지는 경우 운영 당번이 받고 결제팀 리드에게 알립니다. 고객센터가 대응을 준비해야 하기 때문입니다."
    gold: {why: filled, when: filled, who: filled, how: missing, fallback: missing}
    supplement: "대행사 장애 연락망 문서의 순서대로 연락합니다."

