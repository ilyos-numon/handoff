# expected_gaps: 모의 업무 자료에만 있고 인수인계 답변에 없는 주제.
expected_gaps:
  - "수수료 검증"
  - "정산 배치 재실행"
  - "대행사 장애 연락망"
  - "로그 보관"

# loop_cases: 후임 미답 질문(successor_questions q16·q17)과 그 질문에 직접 답하는 퇴사자 답.
loop_cases:
  - question: "정산 배치가 실패하면 손으로 어떻게 복구하나요?"
    answer: "정산 배치 로그에서 실패한 단계를 확인하고, 원인을 고친 뒤 정산 배치 재실행 스크립트로 실패한 날짜만 다시 돌립니다. 금액 차이가 남으면 정산 담당에게 알립니다."
  - question: "결제 대행사 쪽에 장애가 나면 누구한테 연락해요?"
    answer: "결제 대행사에 장애가 나면 대행사 장애 연락망 문서의 순서대로 연락합니다. 야간에는 운영 당번이 먼저 받고 결제팀 리드에게 알립니다."

drill_answers:
  weak: "잘 모르겠습니다"
