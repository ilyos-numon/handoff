answers:
  sys-01:
    main: "결제 승인 모듈 배포가 가장 무섭습니다. 승인 요청이 끊기면 바로 매출 손실이라서요. 특히 결제 대행사 연동 설정을 함께 바꾸는 배포는 승인 실패율이 순간적으로 튈 수 있어 항상 트래픽이 적은 오전에 합니다."
    follow_up: "예전에 승인 실패율이 급등했을 때 이전 버전 이미지로 즉시 롤백해서 복구했습니다. 지금도 배포 도구의 롤백 버튼으로 같은 방법이 통하고, 배포 직후에는 승인 실패율 지표를 꼭 봅니다."
  rou-01:
    main: "매주 월요일 오전에 지난주 미정산 거래 목록을 뽑아 정산 담당자에게 보냅니다. 관리자 화면의 미정산 조회 메뉴에서 기간을 지정해 내려받고, 공유 드라이브의 주간 정산 폴더에 올립니다."
    follow_up: "한 번 빼먹은 적이 있는데, 정산 담당자가 가맹점 지급 보류 건을 늦게 알아서 지급이 하루 밀렸습니다. 그 뒤로 공유 달력에 반복 알림을 걸어 두었습니다."
  inc-01:
    main: "작년 여름 결제 승인 지연 장애가 여섯 시간 걸렸습니다. 원인은 데이터베이스 커넥션 풀 고갈이었는데, 정산 조회 쿼리가 인덱스를 못 타면서 커넥션을 오래 잡고 있었습니다."
    follow_up: "처음엔 승인 서버 에러 로그와 커넥션 풀 사용률 그래프를 봤습니다. 이후 조회용 복제본으로 정산 쿼리를 분리했고, 쿼리 타임아웃 설정은 아직 숙제로 남아 있습니다."
  ppl-01:
    main: "막히면 결제팀 리드에게 먼저 묻습니다. 팀 메신저의 결제 개발 채널에 질문을 올리고 리드를 언급하면 보통 한 시간 안에 답이 옵니다. 급하면 메신저 음성 통화를 씁니다."
    follow_up: "리드가 휴가일 때는 정산 시스템을 같이 만든 시니어 개발자에게 묻거나, 결제 개발 채널의 지난 대화를 검색해서 비슷한 사례를 찾았습니다."
  sys-02:
    main: "주문 서비스가 결제 완료 이벤트를 메시지 큐로 받아 배송 요청을 만듭니다. 문서에는 없지만 이벤트 스키마를 바꾸면 주문 서비스가 바로 깨지니 필드 추가만 하고 삭제나 이름 변경은 하지 않습니다."
    follow_up: "의존이 끊기면 결제는 완료인데 주문 상태가 결제 대기로 남는 건이 먼저 쌓입니다. 고객 문의가 늘기 전에 메시지 큐 적체 지표로 먼저 알 수 있습니다."
  rou-02:
    main: "배포 전에 변경 목록과 마이그레이션 여부를 확인하고, 배포 후 승인 실패율과 에러 로그를 30분 봅니다. 금요일 배포는 하지 않습니다. 예전에 금요일 배포 뒤 정산 배치가 주말 내내 실패했는데 월요일에야 알아서 수습이 오래 걸렸기 때문입니다."
    follow_up: "배포 후 정산 배치 결과 확인은 아직 자동화하지 못했습니다. 다음 날 새벽 배치가 끝나야 결과를 알 수 있어서 아침에 사람이 직접 봅니다. 월말 사흘 동안도 배포를 피합니다."
  inc-02:
    main: "결제 대행사 응답 지연이 다시 터질 것 같습니다. 재시도 로직이 지연을 더 키우는 구조라 대행사가 느려지면 승인 서버 스레드가 먼저 바닥납니다. 근본 수정은 회로 차단기 도입인데 아직 못 했습니다."
    follow_up: "터지면 먼저 관리자 화면에서 해당 결제수단을 일시 중지해 다른 결제수단으로 유도하세요. 그다음 장애 채널에 상황을 공유하면 됩니다."
  ppl-02:
    main: "결제 대행사와 매달 정산 대사 파일을 주고받는 일을 꼭 이어받아야 합니다. 매달 셋째 영업일까지 대행사가 보낸 파일을 우리 거래 내역과 맞춰 보고 차이 목록을 회신합니다."
    follow_up: "차이 건은 거래 번호와 금액을 표로 정리해 보내야 다시 묻지 않습니다. 회신 기한을 넘기면 다음 달 대사 일정이 밀리니 기한을 꼭 지키세요."
  sys-03:
    main: "승인 요청 타임아웃과 재시도 횟수는 함부로 바꾸면 안 됩니다. 타임아웃을 늘리면 스레드가 막히고, 재시도를 늘리면 중복 승인 위험이 생깁니다. 지금은 타임아웃 5초, 재시도 1회입니다."
    follow_up: "바꿔야 하면 테스트 환경에서 부하 테스트를 먼저 하고, 결제팀 리드 승인을 받은 뒤 트래픽이 적은 오전에 서버를 하나씩 적용합니다."
  rou-03:
    main: "출근하면 결제 모니터링 대시보드에서 밤사이 승인 실패율과 새벽 정산 배치 결과를 먼저 봅니다. 알림 채널에 밤사이 쌓인 경고도 훑어봅니다."
    follow_up: "승인 실패율이 평소의 두 배를 넘거나 정산 배치가 실패로 표시되면 바로 조치를 시작합니다. 원인을 보기 전에 결제팀 리드에게 먼저 알립니다."
  inc-03:
    main: "알림이 오면 먼저 영향 범위를 봅니다. 승인 실패율, 에러 로그, 최근 배포 이력 순서로 확인하고, 최근 배포가 있으면 롤백을 먼저 검토합니다. 5분 안에 장애 채널에 상황을 공유합니다."
    follow_up: "후임이 가장 놓치기 쉬운 단계는 장애 채널에 첫 공유를 하는 것입니다. 원인을 찾느라 공유가 늦어지면 고객센터가 대응을 못 합니다."
  ppl-03:
    main: "배포나 설정 변경 전에는 결제팀 리드의 승인을 받고, 정산에 영향이 있으면 정산 담당자에게도 미리 알립니다. 고객 화면이 바뀌면 고객센터 파트장에게 공지를 부탁합니다."
    follow_up: "정산 담당자에게 알리지 않고 수수료 계산 코드를 배포했다가 정산 보고서 숫자가 달라져 하루 종일 해명한 적이 있습니다."
  sys-04:
    main: "결제 원장 테이블은 건수가 많아 조건 없는 조회나 일괄 수정을 하면 안 됩니다. 반드시 거래 일자 조건을 넣어 인덱스를 타게 하고, 운영 데이터베이스에서는 조회만 합니다."
    follow_up: "데이터를 직접 고쳐야 하면 수정 쿼리와 되돌리기 쿼리를 함께 써서 결제팀 리드 검토를 받고, 대상 건을 백업 테이블에 복사한 뒤 실행합니다."
  rou-04:
    main: "결제 대행사 연동용 인증서와 연동 키를 매년 갱신해야 합니다. 만료 30일 전에 알림이 오도록 공유 달력에 등록해 두었고, 대행사 관리 화면에서 새 키를 발급받아 교체합니다."
    follow_up: "갱신을 놓치면 특정 대행사 결제만 전부 인증 오류로 실패합니다. 승인 실패율이 그 대행사에서만 급등하면 인증서 만료부터 의심하세요."
  inc-04:
    main: "네트워크 지연으로 승인 응답을 못 받아 재시도하다가 중복 결제가 난 적이 있습니다. 정산 대사에서 발견했고, 중복 건은 고객센터와 함께 취소했습니다. 이후 주문 번호 기준 중복 방지 키를 넣었습니다."
    follow_up: "중복 건은 같은 주문 번호에 승인 완료가 두 건 이상인 거래를 찾는 점검 쿼리로 찾습니다. 쿼리는 팀 저장소의 운영 점검 폴더에 있습니다."
  ppl-04:
    main: "고객 문의는 고객센터 상담원이 먼저 받고, 결제 오류로 보이면 고객센터 파트장이 티켓을 만들어 결제 개발 채널에 넘겨 줍니다. 개발팀은 티켓 담당자를 정해 하루 안에 답합니다."
    follow_up: "문의를 넘겨받을 때는 주문 번호, 결제 시각, 결제수단, 고객이 본 오류 문구를 꼭 함께 받아야 합니다. 없으면 원인을 찾기 어렵습니다."
  sys-05:
    main: "결제 대행사 두 곳과 연동하고, 결제수단별로 어느 대행사를 쓸지 라우팅 설정으로 정합니다. 승인 요청 타임아웃은 5초, 실패 시 1회만 재시도하고, 그래도 실패하면 결제 실패로 처리합니다."
    follow_up: "대행사 응답이 느려지면 승인 대기 건수가 먼저 늘고, 이어서 결제 화면이 느리다는 문의가 들어옵니다. 콜백 주소를 바꿀 때는 대행사 쪽 설정도 같이 바꿔야 합니다."
  rou-05:
    main: "매일 새벽 정산 배치와 매출 집계 배치가 돕니다. 정산 배치는 결과 화면에서 처리 건수와 실패 건수를 사람이 직접 확인해야 합니다. 실패 건이 있으면 그날 정산 파일이 대행사로 나가지 않습니다."
    follow_up: "매출 집계 배치는 다시 돌려도 안전합니다. 정산 배치 결과가 이상하면 혼자 다시 돌리지 말고 정산 담당자에게 먼저 알리세요."
  inc-05:
    main: "할인 금액 계산을 바꾼 배포에서 일부 쿠폰 결제 금액이 틀려 롤백했습니다. 배포 도구에서 이전 버전을 다시 배포했고, 그사이 잘못 계산된 결제는 목록을 뽑아 부분 환불했습니다."
    follow_up: "컬럼 삭제처럼 데이터베이스 구조를 바꾸는 변경은 롤백이 안 됩니다. 그래서 컬럼 추가, 코드 배포, 컬럼 삭제를 서로 다른 날로 나눠서 진행합니다."
  ppl-05:
    main: "인프라나 데이터베이스 권한은 인프라팀 요청 게시판에 사유와 기간을 적어 신청하고, 결제팀 리드가 승인하면 인프라팀이 보통 하루 안에 열어 줍니다."
    follow_up: "장애 중처럼 급할 때는 장애 채널에서 인프라팀 당직자를 호출하면 되고, 나중에 요청 게시판에 신청 기록을 남깁니다."
  sys-06:
    main: "로그는 통합 로그 검색 화면에서, 지표는 결제 모니터링 대시보드에서 봅니다. 문제를 찾을 때는 주문 번호나 거래 번호로 검색하고, 승인 서버 에러 로그는 에러 코드별로 묶어 봅니다."
    follow_up: "결제 대행사가 보낸 콜백 원문은 로그에 남지 않아서 금액 불일치 원인을 찾기가 어렵습니다. 대행사 관리 화면에서 거래 상세를 따로 조회해야 합니다."
  rou-06:
    main: "연말에는 부가세 신고용 결제 매출 자료를 재무팀에 넘기고, 분기마다 결제 대행사 공지를 확인해 바뀐 연동 규칙을 반영합니다. 연말 자료는 1월 둘째 주까지 넘깁니다."
    follow_up: "연말 자료는 2주 전부터 집계 쿼리를 미리 돌려 숫자를 맞춰 봐야 합니다. 지난번 작업 메모는 팀 위키의 연말 결산 문서에 남겨 두었습니다."
  inc-06:
    main: "명절 할인 행사 때 트래픽이 평소의 다섯 배로 늘어 승인 서버가 버티지 못했습니다. 서버를 급히 늘리고, 결제 버튼에 대기열을 걸어 요청을 나눠 받으며 버텼습니다."
    follow_up: "그 이후로 행사 일정이 잡히면 일주일 전에 승인 서버 수를 미리 두 배로 늘리고, 데이터베이스 커넥션 풀 크기도 행사 기간에만 키워 둡니다."
  ppl-06:
    main: "보안이나 개인정보 검토는 보안팀 검토 담당자와 이야기합니다. 카드 정보나 개인정보 저장 방식이 바뀌면 반드시 보안 검토 요청서를 올려야 배포할 수 있습니다."
    follow_up: "검토는 보통 일주일 걸리고, 데이터 흐름도와 저장 항목 목록, 암호화 방식을 미리 준비하면 빨리 끝납니다."
  sys-07:
    main: "가장 오래된 부분은 부분 취소 금액 계산 코드입니다. 대행사마다 규칙이 달라 예외 처리가 얽혀 있고, 테스트가 부족해서 고치다가 다른 결제수단이 깨질까 봐 그대로 두었습니다."
    follow_up: "고쳐야 한다면 부분 취소 시나리오 테스트부터 돌려 보세요. 대행사별 부분 취소와 쿠폰 결제 취소 테스트가 가장 자주 깨집니다."
  rou-07:
    main: "모든 변경은 리뷰어 한 명 이상의 승인을 받아야 병합되고, 결제 승인과 정산 코드는 결제팀 리드 리뷰가 필수입니다. 배포는 배포 요청 채널에 올리고 리드 확인 후 진행합니다."
    follow_up: "장애 대응 중 급한 수정은 리뷰 전에 배포할 수 있지만, 장애 채널에 남기고 하루 안에 사후 리뷰를 받아야 합니다."
  inc-07:
    main: "새벽마다 울리는 승인 지연 알림은 대부분 오탐입니다. 새벽 정산 배치가 데이터베이스를 많이 써서 잠깐 느려지는 것이라 배치가 끝나면 저절로 풀립니다."
    follow_up: "알림 시각이 정산 배치 시간대와 겹치고 승인 실패율이 평소와 같으면 오탐으로 봐도 됩니다. 실패율까지 오르면 진짜 문제입니다."
  ppl-07:
    main: "운영팀 매니저가 특정 기간 결제 내역 추출을 자주 요청하고, 기획자는 새 결제수단이나 할인 행사 적용을 요청합니다. 추출 요청은 요청 게시판으로만 받습니다."
    follow_up: "행사 직전에 할인 규칙을 바꿔 달라는 요청은 거절하고 다음 배포 일정으로 조정했습니다. 결제 금액이 바뀌는 변경은 최소 사흘 전에 요청해 달라고 합니다."
  sys-08:
    main: "테스트 환경은 결제 대행사의 테스트 서버에 붙는데, 테스트 서버는 부분 취소와 콜백 지연을 운영처럼 재현하지 못합니다. 그래서 그런 기능은 운영에서 소액 실결제로 한 번 더 확인합니다."
    follow_up: "테스트 환경에서는 콜백이 바로 와서 몰랐는데, 운영에서는 콜백이 늦게 와 결제 상태가 잠시 결제 대기로 보이는 문제가 있었습니다."
  rou-08:
    main: "연동 오류로 자동 환불이 실패한 건은 매일 오후 관리자 화면에서 수동 환불합니다. 실패 목록을 확인하고 대행사 관리 화면에서 취소한 뒤 우리 쪽 상태를 환불 완료로 바꿉니다."
    follow_up: "처리한 내역은 공유 드라이브의 수동 환불 기록표에 남기고, 매주 목요일에 정산 담당자와 고객센터 파트장에게 공유합니다."
