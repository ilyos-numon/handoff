# 지식 정직성 평가 고정 데이터 (handoff.evaluation_honesty).
# 가상의 구독 결제 서비스 백엔드 담당자(모의 퇴사자). 사람은 역할로만 적는다.
role: backend_developer
sessions:
  - nodes: 3
  - nodes: 3
answers:
  sys-01:
    main: "정기결제 갱신 배치 배포가 가장 무섭습니다. 갱신 배치를 새벽 3시에 돌리는 이유는 낮에 돌리면 결제 대행사 승인 한도에 걸리기 때문입니다. 그래서 배포 전에 배치 스케줄 화면에서 다음 실행 시각을 먼저 확인합니다."
    follow_up: "갱신 배치가 중간에 멈췄을 때는 실패한 회차 번호만 골라 재청구 스크립트로 다시 실행했습니다. 재청구 대기열을 비우지 않고 배포하면 같은 구독자에게 두 번 청구되는 위험이 있습니다."
  rou-01:
    main: "매달 25일 오전 10시에 다음 달 청구 예정 알림을 관리자 화면에서 수동으로 실행합니다. 오전 10시로 정한 이유는 새벽에 보내면 고객센터 전화가 한꺼번에 몰리기 때문입니다."
    follow_up: "한 번 늦게 보낸 달에는 알림 없이 청구된 구독자들의 환불 요청이 크게 늘었습니다. 그 뒤로 발송 전날 발송 대상 수를 먼저 확인합니다."
  inc-01:
    main: "가장 오래 걸린 장애는 쿠폰 중복 할인 장애로 네 시간이 걸렸습니다. 원인은 아마 할인 계산 캐시가 갱신되지 않은 것 때문이라고 봅니다."
    follow_up: "그때 쿠폰 서버 오류 로그를 먼저 확인했습니다. 쿠폰 만료 처리 로직은 전임자가 만든 것이라 손대기 전에 조심해야 합니다."
  ppl-01:
    main: "구독 청구 쪽에서 막히면 청구팀 리드에게 먼저 묻습니다. 결제 대행 연동 문제는 연동 담당자에게 문의합니다. 질문 글에는 발생 시각과 재현 순서, 관련 화면 캡처를 함께 붙여야 답이 빨리 옵니다."
    follow_up: "자리에 없을 때는 야간 운영 당번에게 연락합니다. 교대 시각은 저녁 일곱 시이고, 당번표는 운영 위키 첫 페이지에 걸려 있습니다."
  sys-02:
    main: "구독 서비스는 카드 토큰 금고에 저장된 토큰으로만 청구합니다. 카드 토큰을 90일만 보관하는 이유는 보안 심사 규정 때문입니다. 토큰 금고가 응답하지 않으면 갱신 청구가 전부 실패합니다."
    follow_up: "토큰 금고 접근 권한이 필요하면 보안팀 채널에 사유를 적어 문의합니다. 허가가 나면 임시 계정이 발급되고 일주일 뒤 자동으로 회수됩니다."
  rou-02:
    main: "배포 전에는 갱신 배치 일정표를 확인하고, 그다음 결제 대행 연동 상태 화면을 봅니다. 배포 직후에는 청구 실패 건수를 10분 동안 지켜봅니다."
    follow_up: "환불 대조 단계는 아직 사람이 직접 확인합니다. 대조 기준표는 아마 재무 규정 때문에 생긴 것 같지만 확실하지 않습니다."
premortem_answers:
  - "가장 먼저 터질 일은 파트너 정산 파일 수신 실패입니다. 외부 대행사가 파일 형식을 예고 없이 바꾸면 대사 작업이 깨지기 때문에 조심해야 합니다."
  - "대사 결과 화면에서 불일치 건수가 늘어나는 것이 첫 징후입니다. 매일 아침 그 화면의 불일치 건수를 먼저 확인합니다."
  - "수신이 실패하면 먼저 연동 담당자에게 연락하고 수동 업로드 절차로 파일을 다시 받습니다."
tacit_cases:
  - question: "재고 발주량은 어떻게 정하나요?"
    answer: "그냥 지난달 판매량을 보고 정합니다."
    tacit: true
  - question: "택배 지연 문의가 오면 언제 보상을 제안하나요?"
    answer: "감으로 사흘 넘게 늦으면 보상 쿠폰을 제안합니다."
    tacit: true
  - question: "야간 점검은 몇 시에 시작하나요?"
    answer: "보통 자정 넘어서 접속자가 줄면 시작합니다."
    tacit: true
  - question: "신규 입점 상점 심사는 얼마나 걸리나요?"
    answer: "경험상 서류가 다 갖춰지면 이틀이면 끝납니다."
    tacit: true
  - question: "광고 문구 수정 요청은 언제 반려하나요?"
    answer: "과장된 느낌이 들면 반려하고 다시 써 달라고 합니다."
    tacit: true
  - question: "사내 메일 서버 백업은 어디에 보관하나요?"
    answer: "백업 파일은 별도 저장소에 30일 동안 보관합니다."
    tacit: false
  - question: "회의록은 누가 정리하나요?"
    answer: "회의를 연 사람이 당일 오후까지 공유 문서에 정리합니다."
    tacit: false
  - question: "프린터 토너는 언제 주문하나요?"
    answer: "잔량 표시가 20퍼센트 아래로 내려가면 총무 요청 양식으로 주문합니다."
    tacit: false
