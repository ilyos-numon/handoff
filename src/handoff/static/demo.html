<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handoff · 데모 나란히 보기</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body id="demo-split-page">
  <main class="demo-intro">
    <h1>Handoff 데모</h1>
    <p>팀장이 자료와 우선 질문을 준비하고, 퇴사자가 첫 세션을 마친 상태로 시작합니다. 팀장·퇴사자·후임 화면을 나란히 보거나, 위 막대의 버튼으로 한 화면씩 바꿔 볼 수 있습니다. 이 데모는 방문자마다 따로 만들어지고 하루 뒤 지워집니다.</p>
    <p id="demo-error" class="error hidden" role="alert"></p>
    <div class="button-row">
      <button id="demo-start" type="button" class="primary hidden">데모 시작</button>
      <a id="demo-open-new" class="hidden" href="/demo" target="_blank" rel="noopener">새 창에서 열기</a>
    </div>
  </main>
  <section class="demo-panes">
    <iframe id="demo-pane-manager" title="팀장 화면"></iframe>
    <iframe id="demo-pane-leaver" title="퇴사자 화면"></iframe>
    <iframe id="demo-pane-successor" title="후임 화면"></iframe>
  </section>
  <script src="/static/demo.js"></script>
</body>
</html>
