# 가상 결제 서비스 백엔드 개발자의 업무 자료 (모의 데이터).
# 사람 이름·회사명·내부 주소 없이 핸들과 역할명만 쓴다. 핸들은 role_map 으로 역할명이 된다.
role_map:
  "@pay-lead": 결제팀 리드
  "@settle-owner": 정산 담당
  "@ops-oncall": 운영 당번
  "@infra-admin": 인프라 관리자
docs:
  - kind: wiki
    title: 결제 시스템 개요
    text: |
      [[승인 서버]] 는 카드 승인 요청을 받아 [[결제 대행사]] 로 넘긴다.
      승인 결과는 [[메시지 큐]] 에 쌓이고, 새벽에 [[정산 배치]] 가 하루치를 모아 정산한다.
      정산 금액이 맞지 않으면 [[수수료 검증 스크립트]] 로 대행사 수수료를 대조한다.
      구조 변경은 @pay-lead 의 검토를 받는다.
  - kind: wiki
    title: 메시지 큐 운영 메모
    text: |
      [[메시지 큐]] 적재량이 평소의 3배를 넘으면 [[승인 서버]] 응답이 느려진다.
      큐 설정 변경은 @infra-admin 에게 요청한다 (infra-admin@example.com).
  - kind: runbook
    title: 정산 배치 실패 대응
    text: |
      1. [[정산 배치]] 로그에서 실패한 단계를 확인한다.
      2. 원인을 고친 뒤 [[정산 배치 재실행 스크립트]] 로 실패한 날짜만 다시 돌린다.
      3. 금액 차이가 남으면 @settle-owner 에게 알린다.
  - kind: runbook
    title: 대행사 장애 대응
    text: |
      [[결제 대행사]] 응답 오류가 5분 넘게 이어지면 [[대행사 장애 연락망]] 을 따라 연락한다.
      야간에는 @ops-oncall 이 먼저 받는다. 긴급 전화 010-0000-0000.
  - kind: cron
    title: 운영 서버 crontab
    text: |
      # 분 시 일 월 요일 작업
      0 2 * * * 정산 배치
      30 4 * * 0 로그 보관 배치
  - kind: incident
    title: 정산 금액 불일치 장애
    text: |
      [[정산 금액 불일치]] 로 [[정산 배치]] 결과를 다시 계산했다.
      대행사 수수료율 변경을 늦게 반영한 것이 원인이었다.
  - kind: incident
    title: 승인 지연 장애
    text: |
      [[승인 지연]] 이 발생해 [[메시지 큐]] 소비자를 늘려 해소했다.
  - kind: commit
    title: 수수료 대조 경계값 수정
    text: |
      fix: [[수수료 검증 스크립트]] 의 반올림 경계값 오류 수정
      chore: [[로그 보관 배치]] 보관 기간을 90일로 조정
  - kind: org
    title: 결제 서비스 역할
    text: |
      결제팀 리드: 결제 구조와 대행사 계약 변경 승인 (@pay-lead, pay-lead@example.com)
      정산 담당: 정산 금액 확인과 차액 처리 (@settle-owner)
      운영 당번: 야간 장애 1차 대응 (@ops-oncall)
