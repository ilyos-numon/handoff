# Handoff — 새 프론트(web/dist)와 FastAPI 를 같은 출처로 묶는다.
# 백엔드에 CORS 가 없고 쿠키가 SameSite=Lax 라서(docs/frontend/07 #2) 반드시 같은 출처로 둔다.
#
# 화면 경로  /, /intro, /chat, /report, /admin, /demo  → SPA(index.html)
# API 경로   아래 location 들                            → 백엔드
# /admin/leavers…, /demo/<api> 처럼 화면과 접두어가 같은 API 를 정확히 갈라야 한다.

upstream handoff_api {
    server localhost:8780;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /srv/handoff/web/dist;
    client_max_body_size 1m;

    # 공통 프록시 설정
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # 클라이언트가 보낸 X-Forwarded-For 를 덮어쓴다 → 데모 시작 횟수 제한 우회 차단(07 #12)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # LLM(qwen) 응답은 20초 + 재시도까지 걸릴 수 있다(03 §10)
    proxy_read_timeout 90s;

    location ~ ^/(auth|sessions|coverage|kb|leavers|depth|drills|question-trees|health|static)(/|$) {
        proxy_pass http://handoff_api;
    }
    location ^~ /admin/leavers {
        proxy_pass http://handoff_api;
    }
    location ~ ^/demo/(start|status|role|reset)$ {
        proxy_pass http://handoff_api;
    }
    # API 문서는 운영에서 닫는다(07 #22). 필요하면 주석 해제.
    # location ~ ^/(docs|openapi\.json)$ { proxy_pass http://handoff_api; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
